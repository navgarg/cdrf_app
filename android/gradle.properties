org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin incremental compilation to avoid incremental cache errors when
# Gradle project root and Gradle/Flutter pub cache are on different drives
# (e.g., project on D: and pub cache on C:). See kotlin.incremental documentation.
kotlin.incremental=false
# Use Flutter built-in Kotlin/new DSL integration.
android.builtInKotlin=true
android.newDsl=true
